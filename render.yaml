services:
  - type: web
    name: janice-workbench-sync
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: "/var/data"
      - key: SYNC_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
